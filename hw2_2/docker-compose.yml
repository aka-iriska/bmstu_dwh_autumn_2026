# Окружение ДЗ 2.2 (то же, что в ДЗ 2.1: S3 на RustFS + Spark + Jupyter).
#   Jupyter:        http://localhost:8888/?token=dwh
#   Spark UI:       http://localhost:4040  (UI приложения из ноутбука, вкладки Jobs/Stages/SQL)
#   Spark master:   http://localhost:8080
#   RustFS консоль: http://localhost:9001  (rustfsadmin / rustfsadmin)

name: dwh-hw2-2

x-spark: &spark
  image: dwh-hw2-2-spark:3.5.3
  build: ./spark

services:
  rustfs-perms:
    image: alpine:3.24
    command: chown -R 10001:10001 /data
    volumes:
      - rustfs-data:/data

  rustfs:
    image: rustfs/rustfs:1.0.4
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 10s
      retries: 10

  # S3 ЗАПОЛНЯЕТСЯ ДАННЫМИ (как в ДЗ 2.1): создать бакет hw2-2 и скопировать туда входы.
  #   events/    — CSV из event_log_22/, исходная таблица для build_scd2.py (--exclude пропускает _manifest.json)
  #   task1/     — справочник кампаний campaigns.csv
  #   task2/, task3/ — датасеты заданий 2 и 3
  rustfs-init:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set rustfs http://rustfs:9000 rustfsadmin rustfsadmin &&
        mc mb --ignore-existing rustfs/hw2-2 &&
        mc mirror --overwrite --remove --exclude "*.json" /data/event_log_22 rustfs/hw2-2/events &&
        mc cp /data/task1/campaigns.csv rustfs/hw2-2/task1/campaigns.csv &&
        mc mirror --overwrite --remove --exclude ".DS_Store" /data/task2 rustfs/hw2-2/task2 &&
        mc mirror --overwrite --remove /data/task3 rustfs/hw2-2/task3
    volumes:
      - ./event_log_22:/data/event_log_22:ro
      - ./task1:/data/task1:ro
      - ./task2:/data/task2:ro
      - ./task3:/data/task3:ro

  # Spark-кластер: один воркер, 4 ядра и 4 ГБ (ресурсы одинаковые для всех замеров).
  spark-master:
    <<: *spark
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports:
      - "127.0.0.1:8080:8080"

  spark-worker:
    <<: *spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 4 --memory 4G
    depends_on:
      - spark-master

  jupyter:
    <<: *spark
    hostname: jupyter
    command: python3 -m notebook --ip=0.0.0.0 --no-browser --ServerApp.token=dwh
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: jupyter
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    volumes:
      - .:/home/spark/work

volumes:
  rustfs-data:
